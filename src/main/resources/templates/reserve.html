<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
    rel="stylesheet">

    <!-- Custom styles for this template -->
    <meta name="author" content="">

    <title>Anuncia 2- Permisos</title>

    <!-- Custom fonts for this template -->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">

    <link href="css/sb-admin-2.min.css" rel="stylesheet">

    <!-- Custom styles for this page -->
    <link href="vendor/datatables/dataTables.bootstrap4.min.css" rel="stylesheet">

</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <header th:replace="layout/layout :: header"></header>
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                 <header th:replace="layout/layoutSuperior :: header"></header>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <!-- Page Heading -->
                    <h1 class="h3 mb-2 text-gray-800">Administrar Oracion 24 Horas</h1>

                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped" id="dataTable" >
                                <thead>
                                <tr>
                                    <th scope="col">Dia</th>
                                    <th scope="col">Hora</th>
                                    <th scope="col">Estado</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="slot : ${slots}">
                                    <td class="m-0 font-weight-bold text-primary text-center" th:if="${slot.diaSiguiente == false}" th:text="'Jueves'"></td>
                                    <td class="m-0 font-weight-bold text-secondary text-center" th:if="${slot.diaSiguiente == true}" th:text="'Viernes'"></td>
                                    <td class="m-0 font-weight-bold text-primary" th:if="${slot.diaSiguiente == false}" th:text="${slot.startTime} + ' - ' + ${slot.startTime.plusMinutes(30)}"></td>
                                    <td class="m-0 font-weight-bold text-secondary" th:if="${slot.diaSiguiente == true}" th:text="${slot.startTime} + ' - ' + ${slot.startTime.plusMinutes(30)}"></td>
                                    <td th:classappend="${slot.reserved} ? 'reserved' : 'available'">
                                        <span class="btn btn-danger" th:if="${slot.reserved}">Ocupado</span>
                                        <form th:action="@{/reserve}" method="post" th:if="${!slot.reserved}">
                                            <input type="hidden" th:name="slotId" th:value="${slot.id}" />
                                            <button class="btn btn-success" type="submit">Reservar</button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>


                <style>
                    .container {
                        justify-content: center;
                    }

                    .aligncenter {
                        text-align: center;
                    }
                </style>
 <!-- Logout Modal-->
    <header th:replace="layout/modalSalir :: header"></header>

                <!-- Bootstrap core JavaScript-->
                <script src="vendor/jquery/jquery.min.js"></script>
                <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

                <!-- Core plugin JavaScript-->
                <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

                <!-- Custom scripts for all pages-->
                <script src="js/sb-admin-2.min.js"></script>
    <!-- Cargar local Storage-->
    <script src="js/storage.js"></script>
    <script src="js/cargarData.js"></script>

                <!-- Page level plugins -->
                <script src="vendor/datatables/jquery.dataTables.min.js"></script>
                <script src="vendor/datatables/dataTables.bootstrap4.min.js"></script>

                <!-- Page level custom scripts
    <script src="js/demo/datatables-demo.js"></script>-->

</body>

</html>
