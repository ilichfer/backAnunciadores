spring.application.name=anunciadores
server.port=5000

# Los secretos (BD, tokens, claves) NO van en este archivo.
# Se leen de application-secrets.properties: en el VPS desde /etc/anunciadores/,
# en local desde la carpeta del proyecto. Ver application-secrets.example.properties
spring.config.import=optional:file:/etc/anunciadores/application-secrets.properties,optional:file:./application-secrets.properties

#Data source
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/anunciadb?sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION'&jdbcCompliantTruncation=false
spring.datasource.username=
spring.datasource.password=

# En produccion el esquema NO se modifica automaticamente; los cambios se aplican con SQL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Token API de la Biblia y bot de Telegram
token=
propiedad.telegram.token=

# JWT (el secreto debe tener al menos 32 caracteres)
security.jwt.secret=
security.jwt.issuer=anunciadores
# 8 horas
security.jwt.ttlMillis=28800000

# Origenes permitidos para CORS (separados por coma)
security.cors.allowed-origins=https://anunciaig.com,https://www.anunciaig.com,http://localhost:3000,http://localhost:5173

# Limite de intentos (por IP) en login, registro publico y contacto
security.rate-limit.max-attempts=10
security.rate-limit.window-minutes=15

logging.level.feign=INFO
logging.level.com.anunciadores.client.TelegramClient=INFO

cloudflare.r2.access-key=
cloudflare.r2.secret-key=
cloudflare.r2.endpoint=
cloudflare.r2.bucket=
cloudflare.r2.public-url=
